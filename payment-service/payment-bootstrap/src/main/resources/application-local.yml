spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29094,localhost:29095}
    consumer:
      group-id: payment-group

  flyway:
    enabled: false


server:
  port: 8082

# Configuration Outbox
outbox:
  polling-interval-ms: 10000
  max-retry: 5

logging:
  level:
    root: INFO
    com.roudane.commerce.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"


app:
  kafka:
    auto-create-dlt: true
    topics:
      - name: order.created
        partitions: 3
        replicas: 1
      - name: payment.validated   # order-service en a besoin pour son consumer
        partitions: 3
        replicas: 1
      - name: payment.failed      # idem
        partitions: 3
        replicas: 1