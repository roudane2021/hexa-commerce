server:
  port: 8084

spring:
  application:
    name: batch-service

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

order-service:
  base-url: http://localhost:8081
  create-order: /api/orders

batch:
  import:
    chunk-size: 10
    skip-limit: 10
    retry-limit: 3
    retry-backoff-ms: 1000
    csv-fields:
      - userId
      - productId
      - quantity
      - unitPrice