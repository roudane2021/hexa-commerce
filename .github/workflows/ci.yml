name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read              # droits minimaux : lecture du code, rien d'autre

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true    # un nouveau push annule le run précédent de la même branche

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'        # = maven.compiler.release de ton pom
          cache: maven              # met en cache ~/.m2, clé = hash de tes pom.xml

      - name: Build et tests (tous les modules)
        run: ./mvnw -B -ntp verify