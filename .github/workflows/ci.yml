name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read              # droits minimaux : lecture du code, rien d'autre

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true    # un nouveau push annule le run précédent de la même branche

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build et tests (tous les modules)
        run: ./mvnw -B -ntp verify

  # Détecte quels services ont été modifiés par le push
  detect:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            order-service:
              - 'order-service/**'
              - 'deploy/docker/order-service/**'
              - 'pom.xml'
              - '.mvn/**'
            payment-service:
              - 'payment-service/**'
              - 'deploy/docker/payment-service/**'
              - 'pom.xml'
              - '.mvn/**'
            batch-service:
              - 'batch-service/**'
              - 'deploy/docker/batch-service/**'
              - 'pom.xml'
              - '.mvn/**'
            analytic-service:
              - 'analytic-service/**'
              - 'deploy/docker/analytic-service/**'
              - 'pom.xml'
              - '.mvn/**'

  images:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
        include:
          - { service: order-service,    module: order-service/order-bootstrap }
          - { service: payment-service,  module: payment-service/payment-bootstrap }
          - { service: batch-service,    module: batch-service }
          - { service: analytic-service, module: analytic-service }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Construire le jar du service
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am package -DskipTests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max