images:
  needs: build-test
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  permissions:
    contents: read
    packages: write
  strategy:
    fail-fast: false
    matrix:
      include:
        - service: order-service
          module: order-service/order-bootstrap
          path: 'order-service/**'
        - service: payment-service
          module: payment-service/payment-bootstrap
          path: 'payment-service/**'
        - service: batch-service
          module: batch-service
          path: 'batch-service/**'
        - service: analytic-service
          module: analytic-service
          path: 'analytic-service/**'
  steps:
    - uses: actions/checkout@v6

    # 1. Détection des changements (comparaison avec le commit précédent du push)
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        base: ${{ github.event.before }}
        filters: |
          src:
            - '${{ matrix.path }}'
            - 'deploy/docker/${{ matrix.service }}/**'
            - 'pom.xml'
            - '.mvn/**'
            # - 'common/**'   # ajoutez ici vos modules partagés éventuels

    # 2. Le reste ne s'exécute que si le service est concerné
    - if: steps.changes.outputs.src == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - if: steps.changes.outputs.src == 'true'
      name: Construire le jar du service
      run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am package -DskipTests

    - if: steps.changes.outputs.src == 'true'
      uses: docker/setup-buildx-action@v4

    - if: steps.changes.outputs.src == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - if: steps.changes.outputs.src == 'true'
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
        tags: |
          type=sha,prefix=,format=short
          type=raw,value=latest

    - if: steps.changes.outputs.src == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/docker/${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max