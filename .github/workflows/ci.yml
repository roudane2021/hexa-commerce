name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read              # droits minimaux : lecture du code, rien d'autre

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true    # un nouveau push annule le run précédent de la même branche

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'        # = maven.compiler.release de ton pom
          cache: maven              # met en cache ~/.m2, clé = hash de tes pom.xml

      - name: Build et tests (tous les modules)
        run: ./mvnw -B -ntp verify

  images:
    needs: build-test                                    # seulement si les tests passent
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # jamais sur une PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                                    # droit d'écriture, uniquement ici
    strategy:
      fail-fast: false                                   # un service en échec n'annule pas les autres
      matrix:
        include:
          - { service: order-service,    module: order-service/order-bootstrap }
          - { service: payment-service,  module: payment-service/payment-bootstrap }
          - { service: batch-service,    module: batch-service }       # adapte au vrai module
          - { service: analytic-service, module: analytic-service }    # adapte au vrai module
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Construire le jar du service
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am package -DskipTests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          # jeton temporaire, rien à stocker

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: type=sha,prefix=,format=short            # tag = identifiant court du commit

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}       # étiquettes OCI : dépôt, commit, date
          cache-from: type=gha
          cache-to: type=gha,mode=max