name: order-service

on:
  push:
    branches: [ main ]
    paths:
      - 'order-service/**'
      - 'deploy/docker/order-service/**'
      - '.github/workflows/order-service.yml'
      - '.github/workflows/_build-service.yml'
  pull_request:
    paths:
      - 'order-service/**'
      - 'deploy/docker/order-service/**'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_build-service.yml
    with:
      service: order-service
      maven-module: order-service/order-bootstrap

  promote-dev:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: roudane2021/hexa-commerce-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag (dev)
        working-directory: deploy/k8s/overlays/dev
        run: |
          kustomize edit set image \
            order-service=ghcr.io/${{ github.repository_owner }}/order-service:${{ needs.ci.outputs.tag }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à commiter"; exit 0
          fi
          git commit -m "chore(dev): order-service -> ${{ needs.ci.outputs.tag }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done
          exit 1