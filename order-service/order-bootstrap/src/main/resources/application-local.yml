spring:
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop      # OK pour test local avec H2, jamais en prod
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:29092,localhost:29094,localhost:29095
    consumer:
      group-id: order-group

  flyway:
    enabled: false               # désactivé en local : Hibernate génère le schéma directement avec ddl-auto

  cloud:
    config:
      enabled: false            # true si tu utilises un Config Server, sinon false pour l'instant

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
  level:
    com.roudane.commerce.order: DEBUG
    org.hibernate.SQL: DEBUG

# Configuration Outbox
outbox:
  polling-interval-ms: 10000
  max-retry: 5


app:
  kafka:
    auto-create-dlt: true
    topics:
      - name: order.created       # payment-service en a besoin pour son consumer
        partitions: 3
        replicas: 1
      - name: payment.validated
        partitions: 3
        replicas: 1
      - name: payment.failed
        partitions: 3
        replicas: 1