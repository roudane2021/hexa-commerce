spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_pass}

  jpa:
    hibernate:
      ddl-auto: validate       # jamais 'update' en hexagonal propre : Flyway gère le schéma
    open-in-view: false        # à désactiver systématiquement en hexagonal (évite les leaks du contexte Hibernate en dehors du repository)
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.roudane.commerce.*"

  cloud:
    config:
      enabled: false            # true si tu utilises un Config Server, sinon false pour l'instant

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html