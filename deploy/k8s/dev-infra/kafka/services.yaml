apiVersion: v1
kind: Service
metadata: { name: kafka-headless }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: kafka }
  ports: [ { name: broker, port: 9092 }, { name: controller, port: 9093 } ]
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports: [ { name: broker, port: 9092 } ]