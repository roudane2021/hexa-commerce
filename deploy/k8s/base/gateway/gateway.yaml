apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: commerce-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: api.dev.commerce.local      # patché par environnement
      allowedRoutes:
        namespaces: { from: Same }          # seules les routes de ce namespace peuvent s'y attacher

    - name: https
      port: 443
      protocol: HTTPS
      hostname: api.dev.commerce.local
      tls:
        mode: Terminate
        certificateRefs:
          - { name: commerce-tls }
      allowedRoutes:
        namespaces: { from: Same }