apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce-dev
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - httproute.yaml
configMapGenerator:
  - name: order-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=kubernetes
      - PAYMENT_SERVICE_BASE_URL=http://payment-service:8082
      - OUTBOX_MAX_RETRY=5
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate     # strict par défaut
      - SPRING_FLYWAY_ENABLED=true                 # strict par défaut
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
