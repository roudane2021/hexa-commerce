apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service
spec:
  parentRefs:
    - name: commerce-gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/orders }
        - path: { type: PathPrefix, value: /api/users }
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [ X-User-Id, X-User-Role ]
      timeouts:
        request: 10s
      backendRefs:
        - { name: order-service, port: 8081 }